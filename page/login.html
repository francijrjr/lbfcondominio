<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>LBF Condomínio</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assests/css/login.css">
</head>

<body>

    <main class="container">
        <section class="logo-section">
            <img
                src="../assests/img/logo.png"
                alt="LBF Condomínio"
                class="logo"
            >
            <h1 class="company-name">
                LBF Condomínio
            </h1>
            <p class="company-description">
                Gestão inteligente para síndicos e moradores
            </p>
        </section>

        <section class="login-card">
            <p class="login-label">
                Entrar como:
            </p>
            <div class="user-selector">
                <button
                    class="selector-btn active"
                    id="btnMorador"
                >
                    <i data-lucide="user"></i>
                    Morador
                </button>
                <button
                    class="selector-btn"
                    id="btnSindico"
                >
                    <i data-lucide="building-2"></i>
                   Síndico
                </button>
            </div>

            <form id="loginForm">
                <input type="hidden" id="userType" value="morador">
                <div class="form-group">
                    <label>E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        required
                    >
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="••••••••"
                        required
                    >
                </div>
                <button
                    type="submit"
                    class="login-btn"
                >
                    <i data-lucide="log-in"></i>
                    Entrar
                </button>
            </form>
            <a
                href="#"
                class="forgot-password"
            >
                Esqueceu sua senha?
            </a>
        </section>
    </main>

    <script>
        lucide.createIcons();
        const btnMorador = document.getElementById("btnMorador");
        const btnSindico = document.getElementById("btnSindico");
        const loginForm = document.getElementById("loginForm");
        const userTypeInput = document.getElementById("userType");

        btnMorador.addEventListener("click", () => {
            btnMorador.classList.add("active");
            btnSindico.classList.remove("active");
            userTypeInput.value = "morador";
        });

        btnSindico.addEventListener("click", () => {
            btnSindico.classList.add("active");
            btnMorador.classList.remove("active");
            userTypeInput.value = "sindico";
        });

        // Redirecionar baseado no tipo de usuário
        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const userType = userTypeInput.value;
            
            if (userType === "morador") {
                window.location.href = "./pagamento.html";
            } else if (userType === "sindico") {
                window.location.href = "./dashboard.html";
            }
        });
    </script>

</body>
</html>
