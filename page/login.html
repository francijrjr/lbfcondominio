<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - LBF Condomínio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assests/css/login.css" />
    <script src="https://unpkg.com/lucide@latest"></script>

    
  </head>
  <body>
    <div class="container">
      <div class="logo-section">
        <img src="../assests/img/logo.png" alt="LBF Condomínio" />
        <p class="logo-subtitle">Gestão inteligente de condomínio</p>
      </div>

      <div class="login-card">
        <p class="card-title">Entrar como:</p>

        <div class="toggle-container">
          <button
            type="button"
            class="toggle-btn active"
            onclick="selectRole(this, 'morador')"
          >
            <i data-lucide="user"></i>
            Morador
          </button>
          <button
            type="button"
            class="toggle-btn"
            onclick="selectRole(this, 'sindico')"
          >
            <i data-lucide="building-2"></i>
            Síndico
          </button>
        </div>

        <form onsubmit="handleSubmit(event)">
          <div class="form-group">
            <label for="email-field">E-mail</label>
            <div class="input-wrapper">
              <span class="icon">
                <i data-lucide="mail"></i>
              </span>
              <input
                type="email"
                id="email-field"
                class="input-field"
                placeholder="seu@email.com"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password-field">Senha</label>
            <div class="input-wrapper">
              <span class="icon">
                <i data-lucide="lock"></i>
              </span>
              <input
                type="password"
                id="password-field"
                class="input-field"
                placeholder="••••••••"
                required
              />
            </div>
          </div>

          <button type="submit" class="submit-btn">
            <i data-lucide="log-in"></i>
            Entrar
          </button>
        </form>

        <div class="forgot-password">
          <a href="#">Esqueceu sua senha?</a>
        </div>
      </div>
    </div>

    <script>
      let currentRole = "morador";

      function selectRole(button, role) {
        document
          .querySelectorAll(".toggle-btn")
          .forEach((btn) => btn.classList.remove("active"));
        button.classList.add("active");
        currentRole = role;
      }

      function handleSubmit(event) {
        event.preventDefault();
        if (currentRole === "morador") {
          window.location.href = "pagamentos.html";
        } else if (currentRole === "sindico") {
          window.location.href = "sin_financeiro.html";
        }
      }
    </script>
  </body>
</html>
