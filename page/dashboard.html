<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard | LBF Condomínio</title>

    <link
        rel="stylesheet"
        href="../assests/css/global.css"
    >
    <link
        rel="stylesheet"
        href="../assests/css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="../assests/css/components/card.css"
    >

    <link
        rel="stylesheet"
        href="../assests/css/dashboard.css"
    >

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

    <main class="dashboard-container">

        <!-- HEADER -->
        <header class="navbar">

            <div class="navbar-left">

                <img
                    src="../assests/img/logo.png"
                    alt="Logo"
                    class="logo"
                >

                <div>

                    <h1 class="brand-title">
                        Francis
                    </h1>

                    <span class="brand-subtitle">
                        Síndico
                    </span>

                </div>

            </div>

            <button class="logout-button">

                <i data-lucide="log-out"></i>

                <span>Sair</span>

            </button>

        </header>
        <section class="dashboard-content">
            <section class="cards-grid">
                <div class="financial-card success-card">
                    <div class="card-icon success-icon">
                        <i data-lucide="trending-up"></i>
                    </div>
                    <span class="card-label">
                        Arrecadado
                    </span>
                    <h2 class="card-value">
                        R$ 3400.00
                    </h2>
                </div>

                <div class="financial-card danger-card">
                    <div class="card-icon danger-icon">
                        <i data-lucide="triangle-alert"></i>
                    </div>
                    <span class="card-label">
                        Em Atraso
                    </span>
                    <h2 class="card-value">
                        R$ 1700.00
                    </h2>
                </div>
            </section>

            <section class="dashboard-section">
                <div class="section-header">
                    <div class="section-title">
                        <i data-lucide="triangle-alert"></i>
                        <h3>
                            Inadimplentes (2)
                        </h3>
                    </div>
                </div>
                <div class="list-container">
                    <article class="resident-card">
                        <div class="resident-left">
                            <div class="resident-icon danger-small">
                                <i data-lucide="triangle-alert"></i>
                            </div>
                            <div>
                                <h4>Pedro Costa</h4>
                                <span>Apt 201</span>
                            </div>
                        </div>
                        <div class="resident-right">
                            <strong>
                                R$ 850.00
                            </strong>
                            <span class="danger-text">
                                Pendente
                            </span>
                        </div>
                    </article>
                    <article class="resident-card">
                        <div class="resident-left">
                            <div class="resident-icon danger-small">
                                <i data-lucide="triangle-alert"></i>
                            </div>
                            <div>
                                <h4>Carlos Souza</h4>
                                <span>Apt 301</span>
                            </div>
                        </div>
                        <div class="resident-right">
                            <strong>
                                R$ 850.00
                            </strong>
                            <span class="danger-text">
                                Pendente
                            </span>
                        </div>
                    </article>
                </div>
            </section>

            <section class="dashboard-section">
                <div class="section-header">
                    <div class="section-title">
                        <i data-lucide="users"></i>
                        <h3>
                            Pagos (4)
                        </h3>
                    </div>
               </div>
                <div class="list-container">
                    <article class="resident-card">
                        <div class="resident-left">
                            <div class="resident-icon success-small">
                                <i data-lucide="dollar-sign"></i>
                            </div>
                            <div>
                                <h4>João Silva</h4>
                                <span>Apt 101</span>
                            </div>
                        </div>
                        <div class="resident-right">
                            <strong>
                                R$ 850.00
                            </strong>
                            <span>
                                01/04/2026
                            </span>
                        </div>
                    </article>
                    <article class="resident-card">
                        <div class="resident-left">
                            <div class="resident-icon success-small">
                                <i data-lucide="dollar-sign"></i>
                            </div>
                            <div>
                                <h4>Maria Santos</h4>
                                <span>Apt 102</span>
                            </div>
                        </div>
                        <div class="resident-right">
                            <strong>
                                R$ 850.00
                            </strong>
                            <span>
                                03/04/2026
                            </span>
                        </div>
                    </article>
                </div>
            </section>
        </section>

        <nav class="bottom-navigation">
            <button class="nav-button active">
                <i data-lucide="chart-column"></i>
                <span>
                    Financeiro
                </span>
            </button>
            <button class="nav-button">
                <i data-lucide="file-text"></i>
                <span>
                    Chamados
                </span>
            </button>
        </nav>
    </main>

    <script
        src="../assests/js/modules/dashboard/dashboard.view.js"
    ></script>

    <script
        src="../assests/js/modules/dashboard/dashboard.controller.js"
    ></script>

</body>
</html>
